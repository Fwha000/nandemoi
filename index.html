<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Undertale - Sans Final Stand</title>
    <style>
        body { background-color: black; color: white; font-family: 'Courier New', monospace; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; user-select: none; }
        #game-container { width: 640px; position: relative; }
        #enemy-sprite { font-size: 80px; text-align: center; margin-bottom: 10px; transition: transform 0.1s; }
        #main-box { border: 4px solid white; height: 260px; width: 500px; position: relative; background: black; margin: 0 auto; overflow: hidden; }
        canvas { background: black; display: block; }
        #ui { margin-top: 15px; font-size: 24px; display: flex; align-items: center; justify-content: space-around; }
        #hp-bar { width: 100px; height: 20px; background: red; border: 2px solid white; }
        #hp-fill { height: 100%; background: #ff0; width: 100%; }
        #timer-ui { color: #ff0; font-weight: bold; }
        
        /* 画面オーバーレイ */
        .overlay {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); flex-direction: column; justify-content: center; align-items: center; z-index: 100;
        }
        #game-over { color: #f00; font-size: 50px; }
        #game-clear { color: #0f0; font-size: 50px; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="enemy-sprite">💀</div>
    <div id="main-box">
        <canvas id="gameCanvas"></canvas>
        <div id="game-over" class="overlay">GAME OVER<div style="font-size:20px; color:white; margin-top:10px;">Press R to Retry</div></div>
        <div id="game-clear" class="overlay">YOU SURVIVED!<div style="font-size:20px; color:white; margin-top:10px;">You spared the skeleton.</div></div>
    </div>
    <div id="ui">
        <div id="timer-ui">TIME: 60</div>
        <div style="display:flex; align-items:center;">
            <span>HP</span>
            <div id="hp-bar"><div id="hp-fill"></div></div>
            <span id="hp-text">20/20</span>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    canvas.width = 500; canvas.height = 260;

    let hp = 20, frame = 0, isEnded = false;
    let timeLeft = 60; // 60秒耐えたらクリア
    const keys = {};

    const heart = { x: 242, y: 220, size: 16, vx: 0, vy: 0, speed: 4.5, gravity: 0.22, jump: -8.0, onGround: false };
    let obstacles = [], blasters = [], platforms = [
        { x: 50, y: 180, w: 120, h: 10, vx: 1.5 },
        { x: 300, y: 110, w: 120, h: 10, vx: -1.5 }
    ];

    window.addEventListener("keydown", e => {
        keys[e.code] = true;
        if (isEnded && e.code === "KeyR") location.reload();
    });
    window.addEventListener("keyup", e => keys[e.code] = false);

    // --- 叩きつけ攻撃 (Slam) ---
    function slamHeart() {
        if (isEnded) return;
        const directions = ["UP", "DOWN", "LEFT", "RIGHT"];
        const dir = directions[Math.floor(Math.random() * directions.length)];
        
        // 敵のグラフィックを動かす
        const sprite = document.getElementById("enemy-sprite");
        
        if (dir === "UP") { heart.vy = -15; sprite.style.transform = "translateY(-30px)"; }
        if (dir === "DOWN") { heart.vy = 15; sprite.style.transform = "translateY(30px)"; }
        if (dir === "LEFT") { heart.vx = -15; sprite.style.transform = "translateX(-30px)"; }
        if (dir === "RIGHT") { heart.vx = 15; sprite.style.transform = "translateX(30px)"; }

        setTimeout(() => sprite.style.transform = "translate(0,0)", 200);
    }

    function update() {
        if (isEnded) return;

        frame++;
        if (frame % 60 === 0 && timeLeft > 0) {
            timeLeft--;
            document.getElementById("timer-ui").innerText = `TIME: ${timeLeft}`;
            if (timeLeft <= 0) { isEnded = true; document.getElementById("game-clear").style.display = "flex"; }
        }

        // 叩きつけ発動 (5秒に1回)
        if (frame % 300 === 0) slamHeart();

        // ハート移動
        if (keys["ArrowLeft"]) heart.vx -= 0.5;
        if (keys["ArrowRight"]) heart.vx += 0.5;
        heart.vx *= 0.9; // 摩擦
        heart.x += heart.vx + (keys["ArrowLeft"] ? -heart.speed : keys["ArrowRight"] ? heart.speed : 0);
        
        heart.vy += heart.gravity;
        heart.y += heart.vy;
        heart.onGround = false;

        // 壁・地面判定
        if (heart.y > canvas.height - heart.size) { heart.y = canvas.height - heart.size; heart.vy = 0; heart.onGround = true; }
        if (heart.y < 0) { heart.y = 0; heart.vy = 0; }
        if (heart.x < 0) { heart.x = 0; heart.vx = 0; }
        if (heart.x > canvas.width - heart.size) { heart.x = canvas.width - heart.size; heart.vx = 0; }

        platforms.forEach(p => {
            p.x += p.vx;
            if (p.x < 0 || p.x + p.w > canvas.width) p.vx *= -1;
            if (heart.vy >= 0 && heart.x + heart.size > p.x && heart.x < p.x + p.w && heart.y + heart.size >= p.y && heart.y + heart.size <= p.y + 12) {
                heart.y = p.y - heart.size; heart.vy = 0; heart.onGround = true; heart.x += p.vx;
            }
        });

        if (keys["ArrowUp"] && heart.onGround) heart.vy = heart.jump;
        heart.x = Math.max(0, Math.min(canvas.width - heart.size, heart.x));

        // 攻撃生成 (難易度は時間で微増)
        const difficulty = 1 - (timeLeft / 60);
        if (frame % Math.max(20, 80 - difficulty * 100) === 0) obstacles.push({ x: 500, y: 210, w: 15, h: 50, vx: -4 - difficulty * 4 });
        if (frame % 150 === 0) blasters.push({ x: 0, y: Math.random()*180, w: 500, h: 30, warning: 40, active: 15, state: 'warning' });

        // 当たり判定
        obstacles.forEach((o, i) => {
            o.x += o.vx;
            if (heart.x < o.x + o.w && heart.x + heart.size > o.x && heart.y < o.y + o.h && heart.y + heart.size > o.y) hp -= 0.5;
            if (o.x < -30) obstacles.splice(i, 1);
        });

        blasters.forEach((b, i) => {
            if (b.state === 'warning') { if (--b.warning <= 0) b.state = 'active'; }
            else { if (--b.active <= 0) blasters.splice(i, 1); else if (heart.y + heart.size > b.y && heart.y < b.y + b.h) hp -= 1; }
        });

        if (hp <= 0) { hp = 0; isEnded = true; document.getElementById("game-over").style.display = "flex"; }

        document.getElementById("hp-fill").style.width = (hp / 20 * 100) + "%";
        document.getElementById("hp-text").innerText = `${Math.ceil(hp)}/20`;
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#0f0"; platforms.forEach(p => ctx.fillRect(p.x, p.y, p.w, p.h));
        ctx.fillStyle = "white"; obstacles.forEach(o => ctx.fillRect(o.x, o.y, o.w, o.h));
        blasters.forEach(b => {
            if (b.state === 'warning') { ctx.strokeStyle = "red"; ctx.setLineDash([5,5]); ctx.strokeRect(0, b.y, 500, b.h); }
            else { ctx.fillStyle = "white"; ctx.setLineDash([]); ctx.fillRect(0, b.y, 500, b.h); }
        });
        if (!isEnded || timeLeft <= 0) {
            ctx.fillStyle = "#2e51ff"; ctx.fillRect(heart.x, heart.y, heart.size, heart.size);
        }
        requestAnimationFrame(() => { update(); draw(); });
    }
    draw();
</script>
</body>
</html>

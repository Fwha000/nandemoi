<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Undertale Clone - Easy Mode</title>
    <style>
        body { background-color: black; color: white; font-family: 'Courier New', monospace; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; user-select: none; }
        #game-container { width: 640px; }
        #enemy-container { height: 160px; display: flex; justify-content: center; align-items: flex-end; padding-bottom: 10px; }
        #enemy-sprite { font-size: 80px; }
        #main-box { border: 4px solid white; height: 240px; width: 500px; position: relative; background: black; margin: 0 auto; overflow: hidden; }
        canvas { background: black; display: block; }
        #ui { margin-top: 15px; font-size: 24px; display: flex; align-items: center; justify-content: center; }
        #hp-bar { width: 120px; height: 20px; background: red; margin: 0 15px; border: 2px solid white; }
        #hp-fill { height: 100%; background: #ff0; width: 100%; }
        .msg { font-size: 18px; color: #0f0; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="enemy-container"><div id="enemy-sprite">💀</div></div>
    <div id="main-box"><canvas id="gameCanvas"></canvas></div>
    <div id="ui">
        <span>LV 1</span>
        <div id="hp-bar"><div id="hp-fill"></div></div>
        <span id="hp-text">20 / 20</span>
    </div>
    <p class="msg">* Easy Mode: You feel determined (and safer).</p>
</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    canvas.width = 500; canvas.height = 240;

    const hpFill = document.getElementById("hp-fill");
    const hpText = document.getElementById("hp-text");

    let hp = 20;
    const maxHp = 20;
    let frame = 0;
    let invulFrame = 0; // 無敵時間用カウンタ
    const keys = {};

    const heart = { x: 242, y: 200, size: 16, vx: 0, vy: 0, speed: 4, gravity: 0.2, jump: -5.5, onGround: false };
    let obstacles = [];
    let blasters = [];
    let platforms = [{ x: 50, y: 150, w: 150, h: 12, vx: 1.5 }, { x: 300, y: 100, w: 150, h: 12, vx: -1 }];

    window.addEventListener("keydown", e => keys[e.code] = true);
    window.addEventListener("keyup", e => keys[e.code] = false);

    function takeDamage(amt) {
        if (invulFrame > 0) return; // 無敵中ならダメージなし
        hp = Math.max(0, hp - amt);
        invulFrame = 60; // 約1秒間の無敵
        if (hp <= 0) { alert("Game Over"); location.reload(); }
    }

    function update() {
        frame++;
        if (invulFrame > 0) invulFrame--;

        // やさしい機能：4秒に1回、HPが1回復する
        if (frame % 240 === 0 && hp < maxHp) hp++;

        // ハート移動
        if (keys["ArrowLeft"]) heart.x -= heart.speed;
        if (keys["ArrowRight"]) heart.x += heart.speed;
        heart.vy += heart.gravity;
        heart.y += heart.vy;
        heart.onGround = false;

        if (heart.y > canvas.height - heart.size) { heart.y = canvas.height - heart.size; heart.vy = 0; heart.onGround = true; }

        platforms.forEach(p => {
            p.x += p.vx;
            if (p.x < 0 || p.x + p.w > canvas.width) p.vx *= -1;
            if (heart.vy >= 0 && heart.x + heart.size > p.x && heart.x < p.x + p.w && heart.y + heart.size >= p.y && heart.y + heart.size <= p.y + 12) {
                heart.y = p.y - heart.size; heart.vy = 0; heart.onGround = true; heart.x += p.vx;
            }
        });

        if (keys["ArrowUp"] && heart.onGround) heart.vy = heart.jump;
        heart.x = Math.max(0, Math.min(canvas.width - heart.size, heart.x));

        // 攻撃生成をゆっくりに (80→120, 150→250)
        if (frame % 120 === 0) obstacles.push({ x: 500, y: 200, w: 20, h: 40, vx: -3 });
        if (frame % 250 === 0) blasters.push({ x: 0, y: Math.random()*150, w: 500, h: 30, warning: 50, active: 20, state: 'warning' });

        obstacles.forEach((o, i) => {
            o.x += o.vx;
            if (Math.abs(heart.x - o.x) < 15 && Math.abs(heart.y - o.y) < 30) takeDamage(2);
            if (o.x < -30) obstacles.splice(i, 1);
        });

        blasters.forEach((b, i) => {
            if (b.state === 'warning') {
                if (--b.warning <= 0) b.state = 'active';
            } else {
                if (--b.active <= 0) blasters.splice(i, 1);
                else if (heart.y + heart.size > b.y && heart.y < b.y + b.h) takeDamage(3);
            }
        });

        hpFill.style.width = (hp / maxHp * 100) + "%";
        hpText.innerText = `${Math.ceil(hp)} / ${maxHp}`;
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#00ff00"; platforms.forEach(p => ctx.fillRect(p.x, p.y, p.w, p.h));
        ctx.fillStyle = "white"; obstacles.forEach(o => ctx.fillRect(o.x, o.y, o.w, o.h));
        blasters.forEach(b => {
            if (b.state === 'warning') { ctx.strokeStyle = "rgba(255,0,0,0.5)"; ctx.strokeRect(0, b.y, 500, b.h); }
            else { ctx.fillStyle = "white"; ctx.fillRect(0, b.y, 500, b.h); }
        });

        // ハートの描画（無敵時間は点滅）
        if (invulFrame % 4 < 2) {
            ctx.fillStyle = "#2e51ff";
            ctx.fillRect(heart.x, heart.y, heart.size, heart.size);
        }

        requestAnimationFrame(() => { update(); draw(); });
    }
    draw();
</script>
</body>
</html>

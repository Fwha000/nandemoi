<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Undertale Clone - Character Update</title>
    <style>
        body { background-color: black; color: white; font-family: 'Courier New', monospace; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; user-select: none; }
        #game-container { width: 640px; }
        
        /* 敵キャラクターの表示エリア */
        #enemy-container {
            height: 180px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 10px;
            position: relative;
        }

        /* 敵のドット絵（CSSと文字で構成） */
        #enemy-sprite {
            font-size: 80px;
            position: relative;
            transition: transform 0.1s;
        }

        /* 吹き出し */
        #bubble {
            position: absolute;
            background: white;
            color: black;
            border-radius: 15px;
            padding: 10px;
            width: 120px;
            left: 380px;
            bottom: 100px;
            font-size: 16px;
            font-weight: bold;
            display: none;
        }
        #bubble::after {
            content: '';
            position: absolute;
            left: -10px;
            top: 20px;
            border-width: 10px 10px 10px 0;
            border-style: solid;
            border-color: transparent white transparent transparent;
        }

        #main-box { border: 4px solid white; height: 200px; width: 500px; position: relative; background: black; margin: 0 auto; overflow: hidden; }
        canvas { background: black; display: block; }
        
        #ui { margin-top: 15px; font-size: 24px; display: flex; align-items: center; justify-content: center; }
        #hp-bar { width: 100px; height: 20px; background: red; margin: 0 15px; border: 2px solid white; }
        #hp-fill { height: 100%; background: #ff0; width: 100%; }
        
        .msg { font-size: 18px; color: white; text-align: center; margin-top: 10px; min-height: 25px; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="enemy-container">
        <div id="enemy-sprite">💀</div>
        <div id="bubble" id="enemy-speech">HEHEHE!</div>
    </div>

    <div id="main-box">
        <canvas id="gameCanvas"></canvas>
    </div>

    <div id="ui">
        <span>LV 19</span>
        <div id="hp-bar"><div id="hp-fill"></div></div>
        <span id="hp-text">20 / 20</span>
        <span id="level-badge" style="color: #0cf; margin-left: 20px;">PHASE 1</span>
    </div>
    <p id="status-msg" class="msg">* Smells like funny bones.</p>
</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    canvas.width = 500; canvas.height = 200;

    const hpFill = document.getElementById("hp-fill");
    const hpText = document.getElementById("hp-text");
    const sprite = document.getElementById("enemy-sprite");
    const bubble = document.getElementById("bubble");
    const levelBadge = document.getElementById("level-badge");
    const statusMsg = document.getElementById("status-msg");

    let hp = 20;
    let frame = 0;
    let phase = 1;
    const keys = {};

    const heart = { x: 242, y: 100, size: 16, vx: 0, vy: 0, speed: 4, gravity: 0.25, jump: -5.5, onGround: false };
    let obstacles = [];
    let blasters = [];

    window.addEventListener("keydown", e => keys[e.code] = true);
    window.addEventListener("keyup", e => keys[e.code] = false);

    // キャラクターのアニメーション（浮遊感）
    function animateEnemy() {
        const y = Math.sin(frame * 0.05) * 10;
        const x = Math.cos(frame * 0.02) * 5;
        sprite.style.transform = `translate(${x}px, ${y}px)`;
    }

    // 敵のセリフ表示
    function speak(text) {
        bubble.innerText = text;
        bubble.style.display = "block";
        setTimeout(() => { bubble.style.display = "none"; }, 2000);
    }

    function updatePhase() {
        if (frame > 0 && frame % 600 === 0 && phase < 3) {
            phase++;
            levelBadge.innerText = `PHASE ${phase}`;
            if (phase === 2) {
                speak("STILL ALIVE?");
                statusMsg.innerText = "* The air is getting colder.";
            }
            if (phase === 3) {
                speak("READY?");
                statusMsg.innerText = "* Darker, yet darker.";
            }
        }
    }

    function spawnAttack() {
        // フェーズに応じた攻撃
        if (frame % (70 - phase * 10) === 0) {
            obstacles.push({ x: 500, y: 150, w: 15, h: 50, vx: -(4 + phase), type: 'bone' });
        }
        if (phase >= 2 && frame % 120 === 0) {
            blasters.push({ x: 0, y: heart.y - 15, w: 500, h: 30, warning: 40, active: 15, state: 'warning' });
        }
        if (phase >= 3 && frame % 150 === 0) {
            obstacles.push({ x: 500, y: 0, w: 15, h: 60, vx: -5, type: 'bone' });
        }
    }

    function update() {
        frame++;
        animateEnemy();
        updatePhase();
        spawnAttack();

        // ハート移動 & 重力
        if (keys["ArrowLeft"]) heart.x -= heart.speed;
        if (keys["ArrowRight"]) heart.x += heart.speed;
        heart.vy += heart.gravity;
        heart.y += heart.vy;

        if (heart.y > canvas.height - heart.size) {
            heart.y = canvas.height - heart.size; heart.vy = 0; heart.onGround = true;
        } else { heart.onGround = false; }
        
        if (keys["ArrowUp"] && heart.onGround) heart.vy = heart.jump;
        heart.x = Math.max(0, Math.min(canvas.width - heart.size, heart.x));

        // 障害物判定
        obstacles.forEach((o, i) => {
            o.x += o.vx;
            if (heart.x < o.x + o.w && heart.x + heart.size > o.x && heart.y < o.y + o.h && heart.y + heart.size > o.y) {
                takeDamage(0.2);
            }
            if (o.x < -20) obstacles.splice(i, 1);
        });

        blasters.forEach((b, i) => {
            if (b.state === 'warning') {
                b.warning--;
                if (b.warning <= 0) b.state = 'active';
            } else {
                b.active--;
                if (heart.y + heart.size > b.y && heart.y < b.y + b.h) takeDamage(0.8);
                if (b.active <= 0) blasters.splice(i, 1);
            }
        });

        hpFill.style.width = (hp / 20 * 100) + "%";
        hpText.innerText = `${Math.ceil(hp)} / 20`;
        if (hp <= 0) location.reload();
    }

    function takeDamage(amt) {
        hp -= amt;
        // ダメージ時に敵が笑う演出
        if (frame % 10 === 0) sprite.innerText = "😈";
        setTimeout(() => { sprite.innerText = "💀"; }, 500);
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // 骨
        ctx.fillStyle = "white";
        obstacles.forEach(o => ctx.fillRect(o.x, o.y, o.w, o.h));

        // ブラスター
        blasters.forEach(b => {
            if (b.state === 'warning') {
                ctx.strokeStyle = "red";
                ctx.setLineDash([5, 5]);
                ctx.strokeRect(0, b.y, 500, b.h);
            } else {
                ctx.fillStyle = "white";
                ctx.fillRect(0, b.y, 500, b.h);
                ctx.fillStyle = "#4af";
                ctx.fillRect(0, b.y + 5, 500, b.h - 10);
            }
        });

        // 青い心臓
        ctx.fillStyle = "#2e51ff";
        ctx.fillRect(heart.x, heart.y, heart.size, heart.size);

        requestAnimationFrame(() => { update(); draw(); });
    }

    draw();
</script>
</body>
</html>

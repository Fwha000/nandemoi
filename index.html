<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Undertale Clone - GitHub Edition</title>
    <style>
        /* style.css の内容をここに直接記述 */
        body {
            background-color: black;
            color: white;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden; /* スクロールバーを非表示にする */
        }

        #game-container {
            width: 640px;
            display: flex;
            flex-direction: column; /* 縦並びにする */
            align-items: center; /* 中央寄せ */
        }

        #dialogue-box {
            border: 3px solid white;
            padding: 20px;
            height: 100px;
            width: calc(100% - 46px); /* paddingとborderを考慮 */
            margin-bottom: 20px;
            font-size: 24px;
            box-sizing: border-box; /* paddingとborderを幅に含める */
            display: flex;
            align-items: center; /* 縦方向中央寄せ */
        }

        #battle-area {
            display: flex;
            justify-content: center;
        }

        canvas {
            border: 3px solid white;
            background: black;
        }

        #ui-area {
            margin-top: 20px;
            font-size: 24px;
            display: flex;
            align-items: center;
            width: 100%; /* 親の幅に合わせる */
        }

        #hp-label {
            margin-right: 10px;
        }

        #hp-bar-bg {
            width: 100px;
            height: 20px;
            background: red;
            margin: 0 15px;
            border: 1px solid white; /* HPバーに枠線を追加 */
        }

        #hp-bar-fg {
            width: 100%; /* JavaScriptで変更される */
            height: 100%;
            background: yellow;
        }

        #player-name {
            margin-right: auto; /* 左寄せ */
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="dialogue-box">
            <p id="typewriter-text"></p>
        </div>
        <div id="battle-area">
            <canvas id="gameCanvas"></canvas>
        </div>
        <div id="ui-area">
            <span id="player-name">HUMAN</span>
            <span id="hp-label">HP</span>
            <div id="hp-bar-bg"><div id="hp-bar-fg"></div></div>
            <span id="hp-text">20 / 20</span>
        </div>
    </div>

    <script>
        // script.js の内容をここに直接記述

        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        canvas.width = 400;
        canvas.height = 200;

        // プレイヤー設定
        const heart = { x: 190, y: 140, size: 16, speed: 4 };
        let hp = 20;
        const maxHp = 20; // 最大HPも定義

        // 弾の設定
        let bullets = [];
        let frames = 0;

        // タイピング演出
        const dialogueElement = document.getElementById("typewriter-text");
        const fullText = "* A mysterious force blocks your way. Dodge the incoming attacks!";
        let currentDisplayedText = "";
        let textIndex = 0;
        let typingDone = false; // タイピングが完了したかどうかのフラグ

        function typeWriter() {
            if (textIndex < fullText.length) {
                currentDisplayedText += fullText.charAt(textIndex);
                dialogueElement.innerHTML = currentDisplayedText;
                textIndex++;
                setTimeout(typeWriter, 50); // 1文字表示にかかる時間
            } else {
                typingDone = true; // タイピング完了
            }
        }

        // キー入力管理
        const keys = {};
        window.addEventListener("keydown", e => keys[e.code] = true);
        window.addEventListener("keyup", e => keys[e.code] = false);

        function update() {
            // ハート移動
            if (keys["ArrowLeft"] && heart.x > 0) heart.x -= heart.speed;
            if (keys["ArrowRight"] && heart.x < canvas.width - heart.size) heart.x += heart.speed;
            if (keys["ArrowUp"] && heart.y > 0) heart.y -= heart.speed;
            if (keys["ArrowDown"] && heart.y < canvas.height - heart.size) heart.y += heart.speed;

            // 弾の生成 (タイピング完了後に弾を生成し始める)
            if (typingDone) {
                frames++;
                if (frames % 20 === 0) { // 20フレームごとに弾を生成
                    bullets.push({ x: Math.random() * canvas.width, y: -20, size: 10, speed: 3 });
                }
            }

            // 弾の移動と判定
            bullets.forEach((b, index) => {
                b.y += b.speed;
                // 当たり判定 (矩形と矩形の衝突判定)
                if (heart.x < b.x + b.size && heart.x + heart.size > b.x &&
                    heart.y < b.y + b.size && heart.y + heart.size > b.y) {
                    hp -= 1;
                    bullets.splice(index, 1); // 弾を削除
                    document.getElementById("hp-bar-fg").style.width = (hp / maxHp * 100) + "%";
                    document.getElementById("hp-text").innerText = `${hp} / ${maxHp}`;
                }
            });

            // 画面外に出た弾を削除
            bullets = bullets.filter(b => b.y < canvas.height + 20); // 画面外に出てしばらくしたら消す

            if (hp <= 0) {
                alert("GAME OVER! Refresh to try again.");
                location.reload(); // ゲームオーバーでリロード
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height); // キャンバスをクリア
            
            // ハート描画
            ctx.fillStyle = "red";
            ctx.fillRect(heart.x, heart.y, heart.size, heart.size);

            // 弾描画
            ctx.fillStyle = "white";
            bullets.forEach(b => ctx.fillRect(b.x, b.y, b.size, b.size));

            requestAnimationFrame(() => {
                update();
                draw();
            });
        }

        // ゲーム開始
        typeWriter(); // まずはタイピング演出から
        // 弾の生成とゲームループはタイピング完了後に開始される
        draw(); // 描画ループを開始
    </script>
</body>
</html>

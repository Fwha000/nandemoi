<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Undertale Clone - Platforms & HP Guard</title>
    <style>
        body { background-color: black; color: white; font-family: 'Courier New', monospace; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; user-select: none; }
        #game-container { width: 640px; }
        
        #enemy-container { height: 160px; display: flex; justify-content: center; align-items: flex-end; padding-bottom: 10px; position: relative; }
        #enemy-sprite { font-size: 80px; position: relative; transition: transform 0.1s; }

        #main-box { border: 4px solid white; height: 240px; width: 500px; position: relative; background: black; margin: 0 auto; overflow: hidden; }
        canvas { background: black; display: block; }
        
        #ui { margin-top: 15px; font-size: 24px; display: flex; align-items: center; justify-content: center; }
        #hp-bar { width: 120px; height: 20px; background: red; margin: 0 15px; border: 2px solid white; }
        #hp-fill { height: 100%; background: #ff0; width: 100%; }
        
        .msg { font-size: 18px; color: white; text-align: center; margin-top: 10px; min-height: 25px; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="enemy-container">
        <div id="enemy-sprite">💀</div>
    </div>

    <div id="main-box">
        <canvas id="gameCanvas"></canvas>
    </div>

    <div id="ui">
        <span>LV 19</span>
        <div id="hp-bar"><div id="hp-fill"></div></div>
        <span id="hp-text">20 / 20</span>
    </div>
    <p id="status-msg" class="msg">* You feel the platforms sliding under your feet.</p>
</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    canvas.width = 500; canvas.height = 240;

    const hpFill = document.getElementById("hp-fill");
    const hpText = document.getElementById("hp-text");
    const sprite = document.getElementById("enemy-sprite");

    let hp = 20;
    const maxHp = 20;
    let frame = 0;
    const keys = {};

    // ハート物理（青い心臓）
    const heart = { 
        x: 242, y: 200, size: 16, 
        vx: 0, vy: 0, 
        speed: 4, gravity: 0.25, jump: -6, 
        onGround: false 
    };

    let obstacles = [];
    let blasters = [];
    let platforms = []; // 足場ブロック

    // 初期足場の生成
    platforms.push({ x: 100, y: 160, w: 100, h: 10, vx: 2 });
    platforms.push({ x: 300, y: 100, w: 80, h: 10, vx: -1.5 });

    window.addEventListener("keydown", e => keys[e.code] = true);
    window.addEventListener("keyup", e => keys[e.code] = false);

    function takeDamage(amt) {
        hp -= amt;
        if (hp < 0) hp = 0; // HPがマイナスにならないようにガード
        
        if (hp === 0) {
            alert("GAME OVER");
            location.reload();
        }
    }

    function update() {
        frame++;
        
        // 敵のアニメーション
        sprite.style.transform = `translate(${Math.cos(frame*0.05)*5}px, ${Math.sin(frame*0.08)*10}px)`;

        // ハート移動
        if (keys["ArrowLeft"]) heart.x -= heart.speed;
        if (keys["ArrowRight"]) heart.x += heart.speed;
        
        heart.vy += heart.gravity;
        heart.y += heart.vy;
        heart.onGround = false;

        // 地面判定
        if (heart.y > canvas.height - heart.size) {
            heart.y = canvas.height - heart.size;
            heart.vy = 0;
            heart.onGround = true;
        }

        // 足場ブロックの更新と判定
        platforms.forEach(p => {
            p.x += p.vx;
            // 壁で跳ね返る
            if (p.x < 0 || p.x + p.w > canvas.width) p.vx *= -1;

            // 足場の上に乗っているかどうかの判定
            if (heart.vy >= 0 && 
                heart.x + heart.size > p.x && 
                heart.x < p.x + p.w && 
                heart.y + heart.size >= p.y && 
                heart.y + heart.size <= p.y + 12) {
                
                heart.y = p.y - heart.size;
                heart.vy = 0;
                heart.onGround = true;
                heart.x += p.vx; // 足場と一緒に移動する
            }
        });

        // ジャンプ
        if (keys["ArrowUp"] && heart.onGround) heart.vy = heart.jump;
        
        // 画面外制限
        heart.x = Math.max(0, Math.min(canvas.width - heart.size, heart.x));

        // 攻撃の生成
        if (frame % 80 === 0) obstacles.push({ x: 500, y: 200, w: 15, h: 40, vx: -5 });
        if (frame % 150 === 0) blasters.push({ x: 0, y: Math.random()*150, w: 500, h: 30, warning: 40, active: 15, state: 'warning' });

        // 障害物判定
        obstacles.forEach((o, i) => {
            o.x += o.vx;
            if (Math.abs(heart.x - o.x) < 15 && Math.abs(heart.y - o.y) < 30) takeDamage(0.5);
            if (o.x < -20) obstacles.splice(i, 1);
        });

        blasters.forEach((b, i) => {
            if (b.state === 'warning') {
                b.warning--;
                if (b.warning <= 0) b.state = 'active';
            } else {
                b.active--;
                if (heart.y + heart.size > b.y && heart.y < b.y + b.h) takeDamage(1);
                if (b.active <= 0) blasters.splice(i, 1);
            }
        });

        // UI更新
        hpFill.style.width = (hp / maxHp * 100) + "%";
        hpText.innerText = `${Math.ceil(hp)} / ${maxHp}`;
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // 足場の描画
        ctx.fillStyle = "#00ff00";
        platforms.forEach(p => ctx.fillRect(p.x, p.y, p.w, p.h));

        // 骨の描画
        ctx.fillStyle = "white";
        obstacles.forEach(o => ctx.fillRect(o.x, o.y, o.w, o.h));

        // ブラスター描画
        blasters.forEach(b => {
            if (b.state === 'warning') {
                ctx.strokeStyle = "red";
                ctx.setLineDash([5, 5]);
                ctx.strokeRect(0, b.y, 500, b.h);
            } else {
                ctx.fillStyle = "white";
                ctx.fillRect(0, b.y, 500, b.h);
                ctx.fillStyle = "#4af";
                ctx.fillRect(0, b.y + 4, 500, b.h - 8);
            }
        });

        // ハート（青）
        ctx.setLineDash([]);
        ctx.fillStyle = "#2e51ff";
        ctx.fillRect(heart.x, heart.y, heart.size, heart.size);

        requestAnimationFrame(() => { update(); draw(); });
    }

    draw();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Undertale Clone - Phase 6: The Zenith</title>
    <style>
        body { background-color: black; color: white; font-family: 'Courier New', monospace; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; user-select: none; }
        #game-container { width: 640px; }
        #enemy-container { height: 140px; display: flex; justify-content: center; align-items: flex-end; position: relative; }
        #enemy-sprite { font-size: 80px; transition: transform 0.1s; text-shadow: 0 0 10px rgba(255,255,255,0.5); }
        #main-box { border: 4px solid white; height: 260px; width: 500px; position: relative; background: black; margin: 0 auto; overflow: hidden; }
        canvas { background: black; display: block; }
        #ui { margin-top: 15px; font-size: 24px; display: flex; align-items: center; justify-content: space-between; padding: 0 50px; }
        #hp-bar { width: 100px; height: 20px; background: red; border: 2px solid white; }
        #hp-fill { height: 100%; background: #ff0; width: 100%; }
        .phase-text { color: #f0f; font-weight: bold; text-transform: uppercase; }
        #msg { text-align: center; color: #fff; margin-top: 10px; height: 20px; font-style: italic; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="enemy-container"><div id="enemy-sprite">💀</div></div>
    <div id="main-box"><canvas id="gameCanvas"></canvas></div>
    <div id="ui">
        <span class="phase-text" id="phase-display">PHASE 1</span>
        <div style="display:flex; align-items:center;">
            <span>HP</span>
            <div id="hp-bar"><div id="hp-fill"></div></div>
            <span id="hp-text" style="margin-left:10px">20/20</span>
        </div>
    </div>
    <p id="msg">* You feel your sins crawling on your back.</p>
</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    canvas.width = 500; canvas.height = 260;

    let hp = 20;
    let frame = 0;
    let phase = 1;
    const keys = {};

    const heart = { x: 242, y: 220, size: 16, vx: 0, vy: 0, speed: 4.5, gravity: 0.22, jump: -8.0, onGround: false };
    let obstacles = [];
    let blasters = [];
    let platforms = [
        { x: 50, y: 180, w: 120, h: 10, vx: 1.2 },
        { x: 300, y: 110, w: 120, h: 10, vx: -1.2 }
    ];

    window.addEventListener("keydown", e => keys[e.code] = true);
    window.addEventListener("keyup", e => keys[e.code] = false);

    function update() {
        frame++;

        // フェーズ更新 (450フレームごと)
        if (frame > 0 && frame % 450 === 0 && phase < 6) {
            phase++;
            const pd = document.getElementById("phase-display");
            pd.innerText = `PHASE ${phase}`;
            const msg = document.getElementById("msg");
            
            if(phase === 5) { pd.style.color = "#f00"; msg.innerText = "* The ground is no longer safe."; }
            if(phase === 6) { pd.style.color = "#fff"; pd.classList.add("blink"); msg.innerText = "* This is your LAST chance."; }
        }

        // 敵のアニメーション（フェーズが上がると激しくなる）
        const intensity = phase * 0.05;
        document.getElementById("enemy-sprite").style.transform = `translate(${Math.cos(frame*intensity)*5}px, ${Math.sin(frame*intensity)*15}px)`;

        // ハート移動 & 重力
        if (keys["ArrowLeft"]) heart.x -= heart.speed;
        if (keys["ArrowRight"]) heart.x += heart.speed;
        heart.vy += heart.gravity;
        heart.y += heart.vy;
        heart.onGround = false;

        if (heart.y > canvas.height - heart.size) { heart.y = canvas.height - heart.size; heart.vy = 0; heart.onGround = true; }

        platforms.forEach(p => {
            p.x += p.vx;
            if (p.x < 0 || p.x + p.w > canvas.width) p.vx *= -1;
            if (heart.vy >= 0 && heart.x + heart.size > p.x && heart.x < p.x + p.w && heart.y + heart.size >= p.y && heart.y + heart.size <= p.y + 12) {
                heart.y = p.y - heart.size; heart.vy = 0; heart.onGround = true; heart.x += p.vx;
            }
        });

        if (keys["ArrowUp"] && heart.onGround) heart.vy = heart.jump;
        if (!keys["ArrowUp"] && heart.vy < -3) heart.vy = -3;
        heart.x = Math.max(0, Math.min(canvas.width - heart.size, heart.x));

        // --- PHASE別の追加攻撃 ---
        
        // Phase 1-4 (既存の攻撃)
        if (frame % 100 === 0) obstacles.push({ x: 500, y: 210, w: 20, h: 50, vx: -3 - (phase*0.5) });
        if (phase >= 2 && frame % 120 === 60) obstacles.push({ x: 500, y: 0, w: 20, h: 80, vx: -4 });
        if (phase >= 3 && frame % 180 === 0) blasters.push({ x: 0, y: Math.random()*180, w: 500, h: 30, warning: 45, active: 15, state: 'warning' });

        // PHASE 5: 下からの突き上げ骨 (地面に居続けると死ぬ)
        if (phase >= 5 && frame % 40 === 0) {
            obstacles.push({ x: Math.random() * 480, y: 240, w: 20, h: 40, vx: 0, vy: -6, type: 'spike' });
        }

        // PHASE 6: 画面半分を覆う「ギガ・ブラスター」
        if (phase >= 6 && frame % 200 === 0) {
            const side = Math.random() > 0.5 ? 0 : 130;
            blasters.push({ x: 0, y: side, w: 500, h: 130, warning: 60, active: 30, state: 'warning', color: 'cyan' });
        }

        // 衝突判定
        obstacles.forEach((o, i) => {
            if(o.type === 'spike') o.y += o.vy; else o.x += o.vx;
            if (heart.x < o.x + o.w && heart.x + heart.size > o.x && heart.y < o.y + o.h && heart.y + heart.size > o.y) {
                hp = Math.max(0, hp - 0.2);
            }
            if (o.x < -30 || o.y < -50) obstacles.splice(i, 1);
        });

        blasters.forEach((b, i) => {
            if (b.state === 'warning') {
                if (--b.warning <= 0) b.state = 'active';
            } else {
                if (--b.active <= 0) blasters.splice(i, 1);
                else if (heart.y + heart.size > b.y && heart.y < b.y + b.h) hp = Math.max(0, hp - 0.4);
            }
        });

        document.getElementById("hp-fill").style.width = (hp / 20 * 100) + "%";
        document.getElementById("hp-text").innerText = `${Math.ceil(hp)}/20`;
        if (hp <= 0) location.reload();
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#0f0"; platforms.forEach(p => ctx.fillRect(p.x, p.y, p.w, p.h));
        ctx.fillStyle = "white"; obstacles.forEach(o => ctx.fillRect(o.x, o.y, o.w, o.h));
        blasters.forEach(b => {
            if (b.state === 'warning') { 
                ctx.strokeStyle = b.color === 'cyan' ? "#0ff" : "red"; 
                ctx.setLineDash([5,5]); ctx.strokeRect(0, b.y, 500, b.h); 
            } else { 
                ctx.fillStyle = b.color === 'cyan' ? "#0ff" : "white"; 
                ctx.setLineDash([]); ctx.fillRect(0, b.y, 500, b.h); 
            }
        });
        ctx.fillStyle = "#2e51ff"; ctx.fillRect(heart.x, heart.y, heart.size, heart.size);
        requestAnimationFrame(() => { update(); draw(); });
    }
    draw();
</script>
</body>
</html>
